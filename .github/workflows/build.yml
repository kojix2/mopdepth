name: build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Crystal (macOS)
        if: matrix.os == 'macos-latest'
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Crystal (MinGW64)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-crystal
            mingw-w64-x86_64-shards
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libdeflate
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libtre
            mingw-w64-x86_64-libsystre
            zip
            file

      - name: Set version variables
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${{ github.ref_name }}
          else
            VERSION="build-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BIN=mopdepth" >> $GITHUB_ENV

      - name: Prepare build directories
        shell: bash
        run: mkdir -p bin

      - name: Build on Linux (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          docker run -d --name alpine -v $(pwd):/workspace -w /workspace crystallang/crystal:latest-alpine tail -f /dev/null
          docker exec alpine apk add --no-cache \
            autoconf automake libtool build-base pkgconf \
            zlib-dev zlib-static \
            libdeflate-dev libdeflate-static \
            bzip2-dev bzip2-static \
            xz-dev xz-static
          docker exec alpine sh -c "
            git clone --depth 1 --branch develop https://github.com/samtools/htslib.git htslib &&
            cd htslib &&
            git submodule update --init --recursive &&
            autoreconf -i && ./configure --disable-libcurl --with-libdeflate &&
            make && make install
            "
          docker exec alpine shards install --without-development
          docker exec alpine crystal build src/depth.cr --release --static -o bin/$BIN
          docker exec alpine chmod +x bin/$BIN
          ldd bin/$BIN || echo "Static binary (no dynamic dependencies)"
          file bin/$BIN
          bin/$BIN --help
          PKG=mopdepth-${VERSION}-${{ matrix.target }}
          mkdir -p $PKG
          cp bin/$BIN $PKG/
          cp LICENSE $PKG/
          cp README.md $PKG/
          tar czf $PKG.tar.gz $PKG

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          brew install pkg-config autoconf automake libtool bzip2 xz zlib libdeflate
          ci/build-htslib-macos.sh
          DEFLATE_A="$(brew --prefix libdeflate)/lib/libdeflate.a"
          BZIP2_A="$(brew --prefix bzip2)/lib/libbz2.a"
          LZMA_A="$(brew --prefix xz)/lib/liblzma.a"
          ZLIB_A="$(brew --prefix zlib)/lib/libz.a"
          export PKG_CONFIG_PATH="$(pwd)/htslib:$PKG_CONFIG_PATH"
          export PKG_CONFIG_DISABLE_UNINSTALLED=1
          shards install --without-development
          crystal build src/depth.cr --release -o bin/$BIN --link-flags="-Wl,-force_load,$(pwd)/htslib/libhts.a $DEFLATE_A $BZIP2_A $LZMA_A $ZLIB_A -framework CoreFoundation -framework SystemConfiguration"
          chmod +x bin/$BIN
          ci/check-portable-macos.sh bin/$BIN
          file bin/$BIN
          bin/$BIN --help
          PKG=mopdepth-${VERSION}-${{ matrix.target }}
          mkdir -p $PKG
          cp bin/$BIN $PKG/
          cp LICENSE $PKG/
          cp README.md $PKG/
          tar czf $PKG.tar.gz $PKG

      - name: Build on Windows (MinGW64)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed autoconf automake libtool make git mingw-w64-x86_64-toolchain mingw-w64-x86_64-bzip2 mingw-w64-x86_64-xz mingw-w64-x86_64-zlib mingw-w64-x86_64-libdeflate mingw-w64-x86_64-gettext
          ci/build-htslib-windows.sh
          export PKG_CONFIG_PATH="$(pwd)/htslib:$PKG_CONFIG_PATH"
          export PKG_CONFIG_DISABLE_UNINSTALLED=1
          HTSLIB_LIBDIR="$(cygpath -m "$(pwd)/htslib")"
          MINGW_LIBDIR="$(cygpath -m /mingw64/lib)"
          STATIC_LIBS="-static -L$HTSLIB_LIBDIR -L$MINGW_LIBDIR -Wl,--start-group -l:libhts.a -l:libbz2.a -l:liblzma.a -l:libz.a -l:libdeflate.a -l:libregex.a -l:libtre.a -l:libintl.a -Wl,--end-group -lws2_32"
          echo "Using STATIC_LIBS=$STATIC_LIBS"
          shards install --without-development
          crystal build src/depth.cr --release -o bin/$BIN.exe --link-flags="$STATIC_LIBS"
          file bin/$BIN.exe
          ci/check-portable-windows.sh bin/$BIN.exe
          bin/$BIN --help
          PKG=mopdepth-${VERSION}-${{ matrix.target }}
          mkdir -p $PKG
          cp bin/$BIN.exe $PKG/
          cp LICENSE $PKG/
          cp README.md $PKG/
          zip -r $PKG.zip $PKG

      - name: Upload artifacts (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: mopdepth-${{ matrix.target }}
          path: |
            mopdepth-*.tar.gz
            mopdepth-*.zip

      - name: Upload release assets (release only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mopdepth-*.tar.gz
            mopdepth-*.zip
